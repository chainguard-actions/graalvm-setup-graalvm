name: Test GraalVM setup with gds-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify gds-token input is accepted (dummy token, expect auth failure not input error)
        id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          gds-token: 'dummy-token-for-input-coverage'
      - name: Assert action ran (input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should either succeed (if it falls back to non-GDS) or fail
          # with an auth/download error — not an input validation error.
          # Either 'success' or 'failure' is acceptable here; 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: gds-token input was accepted by the action (outcome=$OUTCOME)"
