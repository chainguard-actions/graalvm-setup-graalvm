name: Test gds-token input (GraalVM Enterprise Edition)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          distribution: 'graalvm'
          gds-token: 'fake-gds-token-for-coverage'
          github-token: ${{ github.token }}
      - name: Assert action ran (gds-token input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake GDS token, the action is expected to fail because it
          # cannot authenticate with the GraalVM Download Service.
          # We accept either failure (expected) or success (if distribution
          # falls back to community edition).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid gds-token (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (distribution may have ignored gds-token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
