name: Test gds-token input (GraalVM Enterprise Edition)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          gds-token: 'fake-gds-token-for-testing'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert action handled gds-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake GDS token, the action is expected to fail when trying
          # to authenticate with the GraalVM Download Service.
          # We accept either failure (expected with invalid token) or success.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid gds-token (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
