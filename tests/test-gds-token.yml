name: Test gds-token input (GraalVM Enterprise Edition)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          distribution: 'graalvm'
          gds-token: 'fake-gds-token-for-coverage'
          github-token: ${{ github.token }}
      - name: Assert action ran (succeeded or failed gracefully with invalid GDS token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid GDS token is expected to be rejected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
