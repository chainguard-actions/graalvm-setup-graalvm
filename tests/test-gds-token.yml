name: Test GraalVM setup with gds-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          gds-token: 'dummy-token-for-testing'
          check-for-updates: 'false'
        continue-on-error: true
      - name: Assert action ran with gds-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail with an invalid token (expected), but it must have
          # attempted to run — outcome should be 'success' or 'failure', not 'skipped'
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with gds-token input (outcome: $OUTCOME)"
