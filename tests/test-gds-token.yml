name: Test gds-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          gds-token: 'invalid-gds-token-for-testing'
          github-token: ${{ github.token }}
      - name: Assert action ran with gds-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid GDS token, the action is expected to fail (cannot
          # authenticate with the GraalVM Download Service). We accept either
          # failure (invalid token rejected) or success (token path exercised).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid gds-token (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (gds-token input was accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
