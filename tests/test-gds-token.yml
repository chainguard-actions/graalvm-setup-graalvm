name: Test GraalVM setup with gds-token input present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass gds-token alongside graalvm-community so the input is exercised.
      # The community distribution does not use GDS, so the action succeeds
      # while the gds-token input is covered by the with: block.
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          gds-token: 'dummy-token-for-coverage'
          github-token: ${{ github.token }}

      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"

      - name: Assert java is on PATH
        run: |
          if ! which java; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          echo "PASS: java found at $(which java)"

      - name: Assert java version is 21
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "Java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 detected"
