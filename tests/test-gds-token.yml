name: Test GraalVM setup with gds-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          gds-token: 'dummy-token-for-input-coverage'
          check-for-updates: 'false'
        continue-on-error: true
      - name: Assert action ran (gds-token input exercised)
        run: |
          echo "Action step completed (with or without error due to invalid token)"
          echo "PASS: gds-token input was accepted by the action"
