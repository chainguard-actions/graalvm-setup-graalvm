name: Test Oracle GraalVM with empty gds-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          gds-token: ''
          check-for-updates: 'false'
      - name: Assert Oracle GraalVM (not EE download path) was set up
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          if [ -z "$GRAALVM_HOME" ] || [ ! -d "$GRAALVM_HOME" ]; then
            echo "FAIL: GRAALVM_HOME not set or not a directory"
            exit 1
          fi
          OUT="$(java -version 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q 'GraalVM'; then
            echo "FAIL: java is not GraalVM"
            exit 1
          fi
          if ! echo "$OUT" | grep -qE 'version "21'; then
            echo "FAIL: expected Java 21"
            exit 1
          fi
          echo "PASS"
