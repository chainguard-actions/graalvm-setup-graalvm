name: Test GraalVM setup with Maven cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          cache: 'maven'
      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.setup-graalvm.outputs.cache-hit }}
        run: |
          echo "cache-hit output: '$CACHE_HIT'"
          # cache-hit should be either 'true' or 'false' (or empty on first run)
          # Just verify the action completed without error and output is accessible
          echo "PASS: action completed successfully with maven cache option"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert mvn is accessible
        run: |
          # Maven may or may not be pre-installed; just verify java works
          java -version 2>&1
          echo "PASS: java is available with maven cache configured"
