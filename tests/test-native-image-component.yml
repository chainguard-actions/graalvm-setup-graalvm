name: Test GraalVM setup with native-image component
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          components: 'native-image'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert native-image is available
        run: |
          which native-image || (echo "FAIL: native-image not found on PATH" && exit 1)
          native-image --version
          echo "PASS: native-image is available"
      - name: Assert java is available
        run: |
          java -version
          echo "PASS: java is available"
