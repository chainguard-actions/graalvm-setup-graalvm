name: Test GraalVM with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert Java 17 is installed
        run: |
          echo "Checking java version..."
          java -version 2>&1
          if ! java -version 2>&1 | grep -q "17"; then
            echo "FAIL: expected Java 17 but got something else"
            java -version 2>&1
            exit 1
          fi
          echo "PASS: Java 17 is available"
      - name: Assert JAVA_HOME points to Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          JAVA_VERSION_OUTPUT=$("$JAVA_HOME/bin/java" -version 2>&1)
          echo "Java version from JAVA_HOME: $JAVA_VERSION_OUTPUT"
          if ! echo "$JAVA_VERSION_OUTPUT" | grep -q "17"; then
            echo "FAIL: JAVA_HOME does not point to Java 17"
            exit 1
          fi
          echo "PASS: JAVA_HOME points to Java 17"
      - name: Assert javac is available
        run: |
          echo "Checking javac..."
          if ! command -v javac >/dev/null 2>&1; then
            echo "FAIL: javac not found in PATH"
            exit 1
          fi
          javac -version
          echo "PASS: javac is available"
