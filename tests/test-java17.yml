name: Test GraalVM with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          check-for-updates: 'false'
      - name: Assert java is available
        run: |
          if ! command -v java &>/dev/null; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          echo "PASS: java is on PATH"
      - name: Assert java version is 17
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '17'; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 detected"
      - name: Assert JAVA_HOME is set and points to Java 17
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          JAVA_HOME_VER=$("$JAVA_HOME/bin/java" -version 2>&1 | head -1)
          echo "JAVA_HOME java version: $JAVA_HOME_VER"
          if ! echo "$JAVA_HOME_VER" | grep -q '17'; then
            echo "FAIL: JAVA_HOME does not point to Java 17: $JAVA_HOME_VER"
            exit 1
          fi
          echo "PASS: JAVA_HOME points to Java 17"
