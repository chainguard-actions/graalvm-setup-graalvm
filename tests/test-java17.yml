name: Test GraalVM with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm-community'
      - name: Assert Java 17 is installed
        run: |
          echo "Checking java version..."
          java -version 2>&1
          if ! java -version 2>&1 | grep -q "17"; then
            echo "FAIL: expected Java 17"
            java -version 2>&1
            exit 1
          fi
          echo "PASS: Java 17 is installed"
      - name: Assert JAVA_HOME points to Java 17
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          JAVA_HOME_VERSION=$("$JAVA_HOME/bin/java" -version 2>&1 | head -1)
          echo "JAVA_HOME java version: $JAVA_HOME_VERSION"
          if ! echo "$JAVA_HOME_VERSION" | grep -q "17"; then
            echo "FAIL: JAVA_HOME does not point to Java 17"
            exit 1
          fi
          echo "PASS: JAVA_HOME points to Java 17"
      - name: Compile and run a simple Java program
        run: |
          mkdir -p /tmp/java-test
          cat > /tmp/java-test/Hello.java << 'EOF'
          public class Hello {
            public static void main(String[] args) {
              System.out.println("Hello from Java " + Runtime.version().feature());
            }
          }
          EOF
          javac /tmp/java-test/Hello.java -d /tmp/java-test
          OUTPUT=$(java -cp /tmp/java-test Hello)
          echo "Output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "Hello from Java 17"; then
            echo "FAIL: expected 'Hello from Java 17' but got: $OUTPUT"
            exit 1
          fi
          echo "PASS: Java program compiled and ran successfully"
