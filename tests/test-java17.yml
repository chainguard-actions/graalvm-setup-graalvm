name: Test GraalVM setup with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}
      - name: Assert Java 17 is installed
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 17 is installed"
      - name: Assert JAVA_HOME points to GraalVM
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set and exists"
      - name: Assert javac is available
        run: |
          which javac
          javac -version
          JAVAC_VER=$(javac -version 2>&1)
          echo "javac version: $JAVAC_VER"
          if ! echo "$JAVAC_VER" | grep -q "17"; then
            echo "FAIL: expected javac 17 but got: $JAVAC_VER"
            exit 1
          fi
          echo "PASS: javac 17 is available"
