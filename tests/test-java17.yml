name: Test GraalVM with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          check-for-updates: 'false'
      - name: Assert java version is 17
        run: |
          echo "Checking java version..."
          java -version 2>&1
          if ! java -version 2>&1 | grep -q "17"; then
            echo "FAIL: expected Java 17 but got:"
            java -version 2>&1
            exit 1
          fi
          echo "PASS: Java 17 is available"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set to $JAVA_HOME"
      - name: Assert javac version is 17
        run: |
          javac -version 2>&1
          if ! javac -version 2>&1 | grep -q "17"; then
            echo "FAIL: expected javac 17"
            exit 1
          fi
          echo "PASS: javac 17 is available"
