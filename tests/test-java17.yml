name: Test GraalVM setup with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert java is on PATH
        run: |
          which java
          java -version
          echo "PASS: java is available on PATH"
      - name: Assert java version is 17
        run: |
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "17"; then
            echo "FAIL: expected Java 17 but got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 17 detected"
      - name: Assert GraalVM is installed
        run: |
          VERSION=$(java -version 2>&1)
          echo "java version: $VERSION"
          if ! echo "$VERSION" | grep -qi "graalvm\|graal"; then
            echo "FAIL: expected GraalVM JDK but got: $VERSION"
            exit 1
          fi
          echo "PASS: GraalVM detected"
