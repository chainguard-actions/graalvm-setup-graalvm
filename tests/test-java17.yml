name: Test GraalVM setup with Java 17
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-graalvm
        uses: .
        with:
          java-version: '17'
          distribution: 'graalvm-community'

      - name: Assert java is available
        run: |
          if ! command -v java &>/dev/null; then
            echo "FAIL: java command not found in PATH"
            exit 1
          fi
          echo "PASS: java found at $(which java)"

      - name: Assert java version is 17
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "actual java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '17'; then
            echo "FAIL: expected Java 17, got: $JAVA_VER"
            exit 1
          fi
          echo "PASS"

      - name: Assert JAVA_HOME is set and points to valid directory
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          if [ ! -f "$JAVA_HOME/bin/java" ]; then
            echo "FAIL: java binary not found in JAVA_HOME/bin"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"

      - name: Assert javac is available
        run: |
          if ! command -v javac &>/dev/null; then
            echo "FAIL: javac command not found in PATH"
            exit 1
          fi
          JAVAC_VER=$(javac -version 2>&1)
          echo "javac version: $JAVAC_VER"
          if ! echo "$JAVAC_VER" | grep -q '17'; then
            echo "FAIL: expected javac 17, got: $JAVAC_VER"
            exit 1
          fi
          echo "PASS"
