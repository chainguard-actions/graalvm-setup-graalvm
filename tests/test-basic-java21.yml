name: Test basic GraalVM setup with Java 21
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          check-for-updates: 'false'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert java is on PATH
        run: |
          which java || { echo "FAIL: java not found on PATH"; exit 1; }
          java --version
          echo "PASS: java is on PATH"
      - name: Assert java version is 21
        run: |
          VERSION=$(java --version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21, got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 detected"
      - name: Assert GRAALVM_HOME is set
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          if [ -z "$GRAALVM_HOME" ]; then
            echo "FAIL: GRAALVM_HOME is not set"
            exit 1
          fi
          echo "PASS: GRAALVM_HOME=$GRAALVM_HOME"
