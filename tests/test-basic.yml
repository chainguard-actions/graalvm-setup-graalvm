name: Test basic GraalVM setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          check-for-updates: 'false'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert java binary is available
        run: |
          JAVA_VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VERSION"
          if ! java -version 2>&1 | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VERSION"
            exit 1
          fi
          echo "PASS"
