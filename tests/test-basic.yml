name: Test basic GraalVM setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'

      - name: Assert java is available
        run: |
          echo "Checking java binary..."
          if ! command -v java &>/dev/null; then
            echo "FAIL: java command not found in PATH"
            exit 1
          fi
          echo "PASS: java found at $(which java)"

      - name: Assert java version is 21
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "actual java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '21'; then
            echo "FAIL: expected Java 21, got: $JAVA_VER"
            exit 1
          fi
          echo "PASS"

      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
