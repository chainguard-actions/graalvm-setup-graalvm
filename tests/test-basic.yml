name: Test basic GraalVM setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert java is available
        run: |
          echo "Checking java version..."
          java -version
          if ! java -version 2>&1 | grep -q "21"; then
            echo "FAIL: expected Java 21 but got something else"
            exit 1
          fi
          echo "PASS: Java 21 is available"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -d "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set to $JAVA_HOME"
      - name: Assert native-image is available
        run: |
          echo "Checking native-image..."
          if ! command -v native-image >/dev/null 2>&1; then
            echo "FAIL: native-image not found in PATH"
            exit 1
          fi
          native-image --version
          echo "PASS: native-image is available"
