name: Test basic GraalVM setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          check-for-updates: 'false'
      - name: Assert java is available
        run: |
          echo "Checking java is on PATH..."
          if ! command -v java &>/dev/null; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version: $JAVA_VER"
          echo "PASS: java is available"
      - name: Assert java version is 21
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q '21'; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 detected"
