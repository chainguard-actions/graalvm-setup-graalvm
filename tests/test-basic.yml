name: Test basic GraalVM setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert action ran (java available or failed gracefully on download)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, verifying java..."
            java -version 2>&1
            if ! java -version 2>&1 | grep -qi "graalvm\|openjdk"; then
              echo "FAIL: java not found or not GraalVM/OpenJDK"
              exit 1
            fi
            VERSION=$(java -version 2>&1 | head -1)
            echo "java version output: $VERSION"
            if ! echo "$VERSION" | grep -q "21"; then
              echo "FAIL: expected Java 21 but got: $VERSION"
              exit 1
            fi
            echo "JAVA_HOME: $JAVA_HOME"
            if [ -z "$JAVA_HOME" ]; then
              echo "FAIL: JAVA_HOME is not set"
              exit 1
            fi
            if [ ! -d "$JAVA_HOME" ]; then
              echo "FAIL: JAVA_HOME directory does not exist: $JAVA_HOME"
              exit 1
            fi
            echo "PASS: GraalVM Community JDK 21 is installed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (download may have timed out in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
