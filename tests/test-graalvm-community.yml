name: Test GraalVM Community distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          check-for-updates: 'false'
      - name: Assert java version is 21
        run: |
          echo "Checking java version..."
          java -version 2>&1
          if ! java -version 2>&1 | grep -q "21"; then
            echo "FAIL: expected Java 21"
            exit 1
          fi
          echo "PASS: Java 21 is available"
      - name: Assert JAVA_HOME points to GraalVM
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          # GraalVM Community should have graalvm or graal in the path
          if ! echo "$JAVA_HOME" | grep -qi "graal"; then
            echo "WARN: JAVA_HOME does not contain 'graal': $JAVA_HOME"
          fi
          echo "PASS: JAVA_HOME is set to $JAVA_HOME"
      - name: Assert native-image is available
        run: |
          echo "Checking native-image..."
          if ! command -v native-image >/dev/null 2>&1; then
            echo "FAIL: native-image not found on PATH"
            exit 1
          fi
          native-image --version
          echo "PASS: native-image is available"
