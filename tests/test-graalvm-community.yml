name: Test GraalVM Community Edition setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert java is available
        run: |
          java -version 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: java command not available"
            exit 1
          fi
          echo "PASS: java is available"
      - name: Assert java version is 21
        run: |
          VERSION=$(java -version 2>&1 | head -1)
          echo "Java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21, got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 GraalVM Community detected"
      - name: Assert native-image is available
        run: |
          if ! command -v native-image &> /dev/null; then
            echo "INFO: native-image not installed (not a component by default)"
          else
            native-image --version
            echo "PASS: native-image is available"
          fi
