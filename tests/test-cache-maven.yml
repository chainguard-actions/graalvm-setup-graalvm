name: Test cache input (maven)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with cache input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with cache=maven"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to network/sentinel repo) but cache input was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert java is available when action succeeded
        if: steps.action.outcome == 'success'
        run: |
          java -version
          echo "PASS: java is available"
