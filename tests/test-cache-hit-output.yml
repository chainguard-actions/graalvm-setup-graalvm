name: Test cache-hit output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ github.token }}
          check-for-updates: 'false'

      - name: Assert cache-hit output is defined
        env:
          CACHE_HIT: ${{ steps.setup-graalvm.outputs.cache-hit }}
        run: |
          echo "cache-hit output: '$CACHE_HIT'"
          # cache-hit should be either 'true' or 'false' (or empty if no cache input was given)
          # When no cache input is provided, the output may be empty or false — both are acceptable
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit output is valid: '$CACHE_HIT'"
          else
            echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
            exit 1
          fi

      - name: Assert java is functional
        run: |
          if ! which java; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          java -version
          echo "PASS: java is functional"
