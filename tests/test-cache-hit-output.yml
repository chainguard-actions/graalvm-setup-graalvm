name: Test GraalVM setup cache-hit output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
      - name: Assert cache-hit output is defined
        env:
          CACHE_HIT: ${{ steps.setup-graalvm.outputs.cache-hit }}
        run: |
          echo "cache-hit output: '$CACHE_HIT'"
          # cache-hit should be either 'true' or 'false' (or empty on first run)
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ -z "$CACHE_HIT" ]; then
            echo "INFO: cache-hit is empty (first run, no cache configured)"
          else
            echo "cache-hit value: $CACHE_HIT"
          fi
          echo "PASS: cache-hit output is accessible"
      - name: Assert java is working after setup
        run: |
          java -version
          echo "PASS: java is available"
