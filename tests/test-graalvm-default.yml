name: Test GraalVM setup with default distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          check-for-updates: 'false'
          github-token: ${{ github.token }}
      - name: Assert Java 21 is installed
        run: |
          java -version 2>&1
          JAVA_VER=$(java -version 2>&1 | head -1)
          echo "java version output: $JAVA_VER"
          if ! echo "$JAVA_VER" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $JAVA_VER"
            exit 1
          fi
          echo "PASS: Java 21 is installed"
      - name: Assert JAVA_HOME is set and valid
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          if [ ! -f "$JAVA_HOME/bin/java" ]; then
            echo "FAIL: java binary not found in JAVA_HOME/bin"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set and java binary exists"
      - name: Assert GraalVM tools are available
        run: |
          which java
          which javac
          java -version
          javac -version
          echo "PASS: GraalVM tools are on PATH"
