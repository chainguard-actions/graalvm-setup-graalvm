name: Test GraalVM setup with set-java-home false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record original JAVA_HOME
        id: original
        run: |
          echo "original_java_home=${JAVA_HOME:-}" >> "$GITHUB_OUTPUT"
          echo "Original JAVA_HOME: ${JAVA_HOME:-<not set>}"
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          set-java-home: 'false'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert java is on PATH
        run: |
          which java
          java -version
          echo "PASS: java is available on PATH"
      - name: Assert java version is 21
        run: |
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 detected"
