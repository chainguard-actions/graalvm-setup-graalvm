name: Test set-java-home false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record original JAVA_HOME
        id: original-java-home
        run: |
          echo "original_java_home=${JAVA_HOME:-}" >> $GITHUB_OUTPUT
          echo "Original JAVA_HOME: ${JAVA_HOME:-<not set>}"
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          set-java-home: 'false'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert java is available
        run: |
          if ! java --version; then
            echo "FAIL: java command not found"
            exit 1
          fi
          echo "PASS: java is available"
      - name: Assert java version is 21
        run: |
          VERSION=$(java --version 2>&1 | head -1)
          echo "Java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 detected"
      - name: Assert GRAALVM_HOME is set
        run: |
          echo "GRAALVM_HOME: ${GRAALVM_HOME:-<not set>}"
          if [ -z "${GRAALVM_HOME:-}" ]; then
            echo "FAIL: GRAALVM_HOME is not set"
            exit 1
          fi
          echo "PASS: GRAALVM_HOME is set"
