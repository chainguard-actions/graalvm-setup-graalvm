name: Test set-java-home false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record original JAVA_HOME
        id: original
        run: |
          echo "original_java_home=${JAVA_HOME:-}" >> "$GITHUB_OUTPUT"
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          set-java-home: 'false'
          github-token: ${{ github.token }}
      - name: Assert JAVA_HOME was not changed by action
        env:
          ORIGINAL: ${{ steps.original.outputs.original_java_home }}
        run: |
          echo "JAVA_HOME after action: $JAVA_HOME"
          echo "Original JAVA_HOME: $ORIGINAL"
          # When set-java-home is false, JAVA_HOME should remain unchanged
          if [ "$JAVA_HOME" != "$ORIGINAL" ]; then
            echo "FAIL: JAVA_HOME was changed even though set-java-home=false"
            echo "  Before: $ORIGINAL"
            echo "  After:  $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME was not changed"
      - name: Assert java is still on PATH
        run: |
          echo "Checking java is available..."
          java -version
          if ! java -version 2>&1 | grep -q "21"; then
            echo "FAIL: expected Java 21 on PATH"
            exit 1
          fi
          echo "PASS: Java 21 is available on PATH"
