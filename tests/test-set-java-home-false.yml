name: Test GraalVM setup with set-java-home disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record original JAVA_HOME
        id: original-java-home
        run: |
          echo "original_java_home=${JAVA_HOME:-}" >> "$GITHUB_OUTPUT"

      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          set-java-home: 'false'

      - name: Assert java is still available in PATH
        run: |
          if ! command -v java &>/dev/null; then
            echo "FAIL: java command not found in PATH"
            exit 1
          fi
          echo "PASS: java found at $(which java)"

      - name: Assert JAVA_HOME was not changed by the action
        env:
          ORIGINAL: ${{ steps.original-java-home.outputs.original_java_home }}
        run: |
          echo "JAVA_HOME after action: $JAVA_HOME"
          echo "JAVA_HOME before action: $ORIGINAL"
          # When set-java-home is false, JAVA_HOME should remain unchanged
          if [ "$JAVA_HOME" != "$ORIGINAL" ]; then
            echo "FAIL: JAVA_HOME was changed despite set-java-home=false"
            echo "  Before: $ORIGINAL"
            echo "  After:  $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME was not changed"
