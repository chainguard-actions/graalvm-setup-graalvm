name: Test GraalVM setup with set-java-home false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record original JAVA_HOME
        id: original
        run: |
          echo "original_java_home=${JAVA_HOME}" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          set-java-home: 'false'
      - name: Assert JAVA_HOME was not changed to GraalVM
        env:
          ORIGINAL_JAVA_HOME: ${{ steps.original.outputs.original_java_home }}
        run: |
          echo "JAVA_HOME after action: $JAVA_HOME"
          echo "Original JAVA_HOME: $ORIGINAL_JAVA_HOME"
          # When set-java-home is false, JAVA_HOME should remain unchanged
          if [ "$JAVA_HOME" != "$ORIGINAL_JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME was changed despite set-java-home=false"
            echo "  Before: $ORIGINAL_JAVA_HOME"
            echo "  After:  $JAVA_HOME"
            exit 1
          fi
          echo "PASS: JAVA_HOME was not changed"
