name: Test cache input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ github.token }}
      - name: Assert Java is available
        run: |
          echo "Checking java is on PATH after setup with cache=maven"
          if ! java -version 2>&1; then
            echo "FAIL: java not found on PATH"
            exit 1
          fi
          echo "PASS: java is available"
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME is set to $JAVA_HOME"
