name: Test GraalVM setup with Liberica distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk'
          github-token: ${{ github.token }}
          check-for-updates: 'false'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert java is on PATH
        run: |
          which java
          java -version
          echo "PASS: java is available on PATH"
      - name: Assert java version is 21
        run: |
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21 but got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 detected"
      - name: Assert javac is available
        run: |
          which javac
          javac -version
          echo "PASS: javac is available"
