name: Test GraalVM setup with Liberica distribution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4
      - id: setup-graalvm
        uses: .
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk'
      - name: Assert JAVA_HOME is set
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "FAIL: JAVA_HOME is not set"
            exit 1
          fi
          echo "PASS: JAVA_HOME=$JAVA_HOME"
      - name: Assert java is on PATH
        run: |
          which java
          java -version
          echo "PASS: java is available"
      - name: Assert Java version is 21
        run: |
          VERSION=$(java -version 2>&1 | head -1)
          echo "java version output: $VERSION"
          if ! echo "$VERSION" | grep -q "21"; then
            echo "FAIL: expected Java 21, got: $VERSION"
            exit 1
          fi
          echo "PASS: Java 21 (Liberica) is installed"
